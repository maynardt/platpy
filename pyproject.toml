[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platpy"
version = "0.1.0"
description = "Pipeline for Layered Analysis of Transcriptomics"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["spatial transcriptomics", "spatial genomics", "Visium", "Xenium", "bioinformatics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.0,<3",
    # <2025: newer dask fully removes the legacy (non dask-expr) dataframe
    # engine, which the `analysis` extra's spatialdata dependency still
    # requires (it force-disables query-planning on import).
    "dask[array]>=2024.1,<2025",
    # <3: io_utils.py writes images via a direct zarr.open_group().require_dataset(
    # compressor=...) call using the legacy numcodecs compressor API, which
    # zarr 3.x's array-creation codec pipeline rejects. A move to zarr 3 needs
    # that write path updated first -- see platpy_migration_plan.md Item 0.
    "zarr>=2.18,<3",
    "numcodecs>=0.12,<1",
    "anndata>=0.10",
    "scanpy>=1.10",
    "scipy>=1.12",
    "scikit-image",
    "shapely>=2.0",
    "opencv-python",
    "matplotlib",
    "tifffile>=2024.1",
    "igraph",
    "leidenalg",
]

[project.optional-dependencies]
interactive = ["napari>=0.5", "magicgui", "qtpy", "pyqt6"]
# <1.7: squidpy>=1.7 pulls a modern spatialdata that requires zarr>=3 (see the
# zarr pin above for why that's not compatible with this codebase yet).
# setuptools<81: a squidpy/spatialdata transitive dep (xarray_schema) still
# imports pkg_resources, which setuptools>=81 no longer bundles.
analysis = ["squidpy>=1.4,<1.7", "setuptools<81"]
harmony = ["harmonypy"]
dev = ["jupyter", "ipywidgets"]

[tool.setuptools.packages.find]
where = ["."]
include = ["platpy*"]

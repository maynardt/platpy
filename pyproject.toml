[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platpy"
version = "0.1.3"
description = "Pipeline for Layered Analysis of Transcriptomics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["spatial transcriptomics", "spatial genomics", "Visium", "Xenium", "bioinformatics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.0,<3",
    "dask[array]>=2024.1",
    "zarr>=3",
    "ome-zarr>=0.15",
    "anndata>=0.10",
    "scanpy>=1.10",
    "scipy>=1.12",
    "scikit-image",
    "shapely>=2.0",
    "opencv-python",
    "matplotlib",
    "tifffile>=2024.1",
    "igraph",
    "leidenalg",
]

[project.optional-dependencies]
interactive = ["napari>=0.5", "magicgui", "qtpy", "pyqt6"]
# setuptools<81: depending on which spatialdata patch version the resolver picks (still
# version-sensitive as of squidpy 1.8), a squidpy/spatialdata transitive dep (xarray_schema)
# may still import pkg_resources, which setuptools>=81 no longer bundles. Cheap to keep pinned.
analysis = ["squidpy>=1.4", "setuptools<81"]
harmony = ["harmonypy"]
dev = ["jupyter", "ipywidgets"]

[tool.setuptools.packages.find]
where = ["."]
include = ["platpy*"]

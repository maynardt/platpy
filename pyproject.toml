[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platpy"
version = "0.1.0"
description = "Pipeline for Layered Analysis of Transcriptomics"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["spatial transcriptomics", "spatial genomics", "Visium", "Xenium", "bioinformatics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.0,<3",
    "dask[array]>=2024.1",
    "zarr>=2.18,<3",
    "numcodecs>=0.12,<1",
    "anndata>=0.10",
    "scanpy>=1.10",
    "scipy>=1.12",
    "scikit-image",
    "shapely>=2.0",
    "opencv-python",
    "matplotlib",
    "tifffile>=2024.1",
    "igraph",
    "leidenalg",
]

[project.optional-dependencies]
interactive = ["napari>=0.5", "magicgui", "qtpy"]
analysis = ["squidpy>=1.4"]
harmony = ["harmonypy"]
dev = ["jupyter", "ipywidgets"]

[tool.setuptools.packages.find]
where = ["."]
include = ["platpy*"]
